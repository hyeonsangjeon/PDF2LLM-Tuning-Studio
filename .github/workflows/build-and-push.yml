name: Build and push PDF-QA image (GHCR)

# Builds the public GPU PDF Q&A extraction image and pushes it to the GitHub
# Container Registry (ghcr.io). One public image is consumed by both
# Azure ML and SageMaker, so learners can `docker pull` without a cloud account.

on:
  push:
    branches: [main]
    paths:
      - "pdf_qa_extraction/**"
      - ".github/workflows/build-and-push.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "pdf_qa_extraction/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pdf-qa-extractor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip on PRs from forks (no package write permission).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: pdf_qa_extraction
          file: pdf_qa_extraction/Dockerfile
          # Push on branch/tag builds; PRs only validate the build.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
