name: Build and push PDF-QA image (GHCR)

# Builds the public GPU PDF Q&A extraction image and pushes it to the GitHub
# Container Registry (ghcr.io). One public image is consumed by both
# Azure ML and SageMaker, so learners can `docker pull` without a cloud account.

on:
  push:
    branches: [main]
    paths:
      - "pdf_qa_extraction/**"
      - ".github/workflows/build-and-push.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "pdf_qa_extraction/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pdf-qa-extractor

# A new push to the same ref cancels an in-flight build (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip on PRs from forks (no package write permission).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: pdf_qa_extraction
          file: pdf_qa_extraction/Dockerfile
          # Push on branch/tag builds; PRs only validate the build.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test & image size
        # Only on pushed builds (the image must exist in the registry to pull).
        if: github.event_name != 'pull_request'
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "Pulling $REF"
          docker pull -q "$REF"
          echo "::group::Image size"
          docker image inspect "$REF" --format '{{.Size}}' | \
            awk '{printf "Uncompressed image size: %.2f GiB (%d bytes)\n", $1/1073741824, $1}'
          echo "::endgroup::"
          echo "::group::Import smoke test (CPU)"
          docker run --rm "$REF" python -c "import pdf_qa, torch, cv2, unstructured; print('imports OK - pdf_qa', pdf_qa.__version__, '| torch', torch.__version__)"
          echo "::endgroup::"
