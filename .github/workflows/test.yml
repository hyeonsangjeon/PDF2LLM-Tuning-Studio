name: tests & golden-path gate

# Trust gate for the public repo: every push / PR must keep the deterministic,
# credential-free golden path green — full test suite, the packaged demo
# (evidence integrity + EM/F1 == 1.0), a secret/PII scan, and a real wheel
# install. No cloud account, GPU or network model calls required.
on:
  push:
    branches: [main]
    paths:
      - "pdf_qa_extraction/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "pdf_qa_extraction/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pdf_qa_extraction

jobs:
  test:
    name: pytest + demo (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (workflow extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[workflow]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Golden path — verify-demo (evidence integrity + EM/F1 == 1.0)
        run: pdf2llm verify-demo
      - name: Secret / PII scan
        run: pdf2llm scan-secrets

  packaging:
    name: wheel install + packaged demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install runtime deps (workflow extra)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[workflow]"
      - name: Build wheel, install in a clean venv, run packaged verify-demo
        run: python scripts/verify_wheel_install.py
