  # ---- Planned (NOT yet executed — must never carry a measured number) -----
  - id: pdf_native_sft_rag_benchmark
    capability: "PDF-native Base/SFT/PTQ/QAT (+RAG) result card"
    status: planned
    note: >-
      P1-5. The PDF-native workflow's end-to-end training→quant→RAG comparison
