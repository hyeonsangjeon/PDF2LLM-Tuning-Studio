  # ---- vLLM serving benchmark (recorded A100 run) --------------------------
  - id: vram_bf16
    capability: "Serving-only clean weight VRAM — bf16 (GiB)"
    status: recorded_hardware_run
    command: "python -m quantization.v2_bench --mode sweep"
