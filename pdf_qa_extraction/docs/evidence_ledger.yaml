# Claim ledger (P0-11) — every strong quantitative/support claim in the READMEs,
# linked to the exact command + raw artifact that proves it. `build_evidence_index.py
# --check` fails CI if a number here diverges from its source JSON, if the value is
# missing from the referenced README, or if a `planned` feature carries a measured
# number. `--emit` regenerates docs/EVIDENCE.md from this file.
#
# status ∈ {ci_verified, recorded_hardware_run, historical_not_reproduced, planned}
# Paths are relative to pdf_qa_extraction/ (repo README is ../README.md).
# `expected` is written exactly as it appears in the README; the checker parses it as
# a float for the JSON comparison (rounded to the README's decimal places) AND asserts
# the literal string is present in `readme`. String `expected` uses substring matching.

meta:
  repo: hyeonsangjeon/PDF2LLM-Tuning-Studio
  note: >-
    Numbers below are auto-verified against committed raw JSON under
    quantization/results/. Hardware runs are a single recorded A100 (japaneast,
    Spot) run — reproducible from config.yaml, not yet re-executed in CI.

claims:
  # ---- Golden path (credential-free, CI-verified) --------------------------
  - id: demo_golden_path
    capability: "PDF→auditable Q&A offline demo (evidence integrity + EM/F1)"
    status: ci_verified
    command: "pdf2llm verify-demo"
    source: workflows/pdf_native_post_training/public_finance_demo/gold_qa.jsonl
    note: >-
      Deterministic replay: recomputes EM/F1 against the shipped gold fixture and
      verifies run-bundle evidence integrity. Asserted green by the CI test gate.

  # ---- KorQuAD 3-seed A/B/C (recorded A100 run) ----------------------------
  - id: a_bf16_f1
    capability: "A (BF16 LoRA) held-out F1, 3-seed mean"
    status: recorded_hardware_run
    command: "python -m quantization.v2_run agg"
    source: quantization/results/three_way_table.json
    pointer: /aggregate/A_bf16/f1/mean
    expected: "94.83"
    readme: quantization/README.md

  - id: a_bf16_em
    capability: "A (BF16 LoRA) held-out EM, 3-seed mean"
    status: recorded_hardware_run
    command: "python -m quantization.v2_run agg"
    source: quantization/results/three_way_table.json
    pointer: /aggregate/A_bf16/exact_match/mean
    expected: "87.80"
    readme: quantization/README.md

  - id: a_bf16_ppl
