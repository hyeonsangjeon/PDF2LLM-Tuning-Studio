[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-qa"
version = "0.2.0"
description = "Cloud-agnostic PDF -> Q&A extraction core for PDF2LLM-Tuning-Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PDF2LLM-Tuning-Studio" }]
keywords = ["pdf", "llm", "qa-generation", "azure-ai-foundry", "bedrock", "unstructured"]
dependencies = [
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
# PDF partitioning (layout + OCR stack, CPU by default)
pdf = [
    "unstructured[pdf]>=0.15",
    "opencv-python>=4.8",
    "pdf2image>=1.17",
    "pdfminer.six>=20250506",
    "pytesseract>=0.3.10",
]
# Azure AI Foundry (Azure OpenAI + Agent Service) - the Azure-first default
azure = [
    "langchain-openai>=0.2",
    "openai>=1.40",
    "azure-identity>=1.17",
    "azure-ai-projects>=1.0.0",
    "azure-ai-agents>=1.0.0",
]
# AWS Bedrock
aws = [
    "langchain-aws>=0.2",
    "boto3>=1.34",
]
# OpenAI (platform.openai.com)
openai = [
    "langchain-openai>=0.2",
    "openai>=1.40",
]
# Ollama - local, credential-free models (Llama, Qwen, llava ...)
ollama = [
    "langchain-ollama>=0.2",
]
# PDF-native post-training workflow (fixture build + run bundle + evidence)
workflow = [
    "reportlab>=4.0",
    "PyMuPDF>=1.23",
    "jsonschema>=4.0",
    "pyyaml>=6",
]
# CPU-smoke SFT training for the workflow's train stage
train = [
    "torch>=2.1",
    "transformers>=4.40",
    "datasets>=2.18",
]
# Single-node local demo web app (thin UI over the in-process pipeline)
webapp = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
# Test / CI gate: the workflow runtime plus the test runner. This is the
# single source of truth for what CI installs to run pytest + golden path.
test = [
    "pdf-qa[workflow]",
    "pytest>=7",
]

[project.scripts]
pdf2llm = "pdf_qa.cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.package-data]
# Ship the persona ledger, JSON schemas and the synthetic demo fixture in the wheel.
pdf_qa = ["personas.yaml", "settings.yaml", "schemas/*.json"]
# Ship the quantization track's config so its CLIs (e.g. bench_baseselect) resolve
# their default config.yaml when run from an installed wheel, not just from source.
quantization = ["config.yaml", "requirements.txt"]
"workflows.pdf_native_post_training" = ["configs/*.yaml", "configs/policies/*.yaml", "schemas/*.json"]
"workflows.pdf_native_post_training.public_finance_demo" = [
    "docs/*.pdf", "*.jsonl", "*.json", "*.sha256", "*.md", "LICENSE",
]
"workflows.pdf_native_post_training.benchmarks.pdf_native" = [
    "*.yaml", "*.jsonl", "*.json", "*.sha256", "splits/*.json",
    "train/*.jsonl", "train/*.json", "train/*.sha256",
    "historical_final/v1/*.json", "historical_final/v1/*.md",
    "historical_final/v1/per_example/*.jsonl",
]

[tool.setuptools.packages.find]
include = ["pdf_qa*", "evaluation*", "quantization*", "workflows*"]
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]
namespaces = false
