[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-qa"
version = "0.2.0"
description = "Cloud-agnostic PDF -> Q&A extraction core for PDF2LLM-Tuning-Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PDF2LLM-Tuning-Studio" }]
keywords = ["pdf", "llm", "qa-generation", "azure-ai-foundry", "bedrock", "unstructured"]
dependencies = [
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
# PDF partitioning (layout + OCR stack, CPU by default)
pdf = [
    "unstructured[pdf]>=0.15",
    "opencv-python>=4.8",
    "pdf2image>=1.17",
    "pdfminer.six>=20250506",
    "pytesseract>=0.3.10",
]
# Azure AI Foundry (Azure OpenAI + Agent Service) - the Azure-first default
azure = [
    "langchain-openai>=0.2",
    "openai>=1.40",
    "azure-identity>=1.17",
    "azure-ai-projects>=1.0.0",
    "azure-ai-agents>=1.0.0",
]
# AWS Bedrock
aws = [
    "langchain-aws>=0.2",
    "boto3>=1.34",
]
# OpenAI (platform.openai.com)
openai = [
    "langchain-openai>=0.2",
    "openai>=1.40",
]
# Ollama - local, credential-free models (Llama, Qwen, llava ...)
ollama = [
    "langchain-ollama>=0.2",
]
# Single-node local demo web app (thin UI over the in-process pipeline)
webapp = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.package-data]
# Ship the persona ledger inside the wheel / container image.
pdf_qa = ["personas.yaml", "settings.yaml"]

[tool.setuptools.packages.find]
include = ["pdf_qa*"]
namespaces = false
